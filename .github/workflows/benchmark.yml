name: Paired Linux benchmark
on:
  push:
    branches: [codex/performance-bench]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the officially scored commit and parser candidate
        run: |
          mkdir "$RUNNER_TEMP/submitted"
          git archive 5e1cab3fe171c7fe91103d8d672b68b8dc4bd7df | tar -x -C "$RUNNER_TEMP/submitted"
          docker build -q -t submitted "$RUNNER_TEMP/submitted"
          docker build -q -t candidate .
      - name: Generate practice-sized input from the published source
        working-directory: ${{ runner.temp }}
        run: |
          curl --retry 3 -fsSLO https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files/generator.zip
          echo '13724cadbac5a99d847e27cea911cd2e338ff972b46c2039da87452011bb101e  generator.zip' | sha256sum -c -
          unzip -q generator.zip
          cargo run --quiet --release --manifest-path generator/Cargo.toml --bin generate -- --seed 37 --events 20000000 --clicks 5000000 --threads 4 --output practice
      - name: Compare containers on the same machine and input
        run: |
          python3 -m venv "$RUNNER_TEMP/check-env"
          "$RUNNER_TEMP/check-env/bin/pip" -q install polars==2.1.0
          "$RUNNER_TEMP/check-env/bin/python" tests/paired_benchmark.py
      - name: Run published fixtures and exact development answers on the image binary
        working-directory: ${{ runner.temp }}
        run: |
          base=https://www.joinbuilders.org/buildathon/tracks/shopping-sessions/files
          for zip in starter-polars dev-answer; do curl --retry 2 -fsSLO "$base/$zip.zip"; done
          echo '0faa7a2cb78f78682f606f88748cdf7290622db2ee55a71261091f3e01392d60  starter-polars.zip' | sha256sum -c -
          echo '7eb8e1f0b1f431d178d28ac9437ce85809c44eb6393fdd42fb59857f30834fa9  dev-answer.zip' | sha256sum -c -
          unzip -q starter-polars.zip
          unzip -q dev-answer.zip
          cid=$(docker create candidate)
          docker cp "$cid:/usr/local/bin/shopping-sessions" ./solver
          docker rm "$cid"
          export NCPU=4 POLARS_MAX_THREADS=4
          check-env/bin/python starter-polars/scripts/run_fixtures.py starter-polars/fixtures -- "$PWD/solver"
          generator/target/release/generate --seed 1 --events 1000000 --clicks 250000 --threads 4 --output dev
          DATA_DIR="$PWD/dev" OUTPUT_DIR="$PWD/dev-out" ./solver
          check-env/bin/python starter-polars/scripts/compare.py dev-out dev-answer
      - name: Run one full-size input
        run: |
          "$RUNNER_TEMP/generator/target/release/generate" --seed 91 --events 60000000 --clicks 15000000 --threads 4 --output "$RUNNER_TEMP/final91"
          python3 tests/paired_benchmark.py --final
