[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
memchr = "2.7"
memmap2 = "0.9"
parquet = { version = "=56.2.0", default-features = false }
rayon = "1.10"
rustc-hash = "2.1"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
